<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#cbcac7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="/burger.svg">
    <link rel="stylesheet" href="style.css">
    <title>Harrison Oates</title>
    <script src="main.js" type="module"></script>
  </head>
  <body>
    <header class="NavRoot">
      <a class="NavMark" href="/" data-route="home" aria-label="Home">HO.</a>
      <nav class="NavPanel">
        <a class="NavLink" href="/" data-route="home">Home</a>
        <a class="NavLink" href="/projects" data-route="projects">Projects</a>
        <!-- <a class="NavLink" href="/work" data-route="work">Work</a> -->
        <button class="ThemeToggle" type="button" aria-label="Dark theme" aria-pressed="false">
          <span class="ThemeDisc"></span>
        </button>
      </nav>
    </header>

    <main>
      <section class="LoaderLogoSection" data-route="home">
        <div class="LoadingText" aria-hidden="true"><span>H</span><span>O</span></div>
      </section>

      <section class="LandingPageSection" data-route="home">
        <div class="LandingStage"></div>

        <div class="LandingLead">
          <h1 class="MyName">Harrison Oates</h1>
          <p class="LandingRole">Embedded software performance engineer at DroneShield.</p>
        </div>

        <div class="LandingBand">
          <div class="attractor-switch" role="group" aria-label="Shape"></div>
          <div class="ViewerControls">
            <label class="viewer-control">
              <span>Size</span>
              <input type="range" id="particleSize" min="0" max="1" value="0">
              <output>1.0</output>
            </label>
            <label class="viewer-control">
              <span>Particles</span>
              <input type="range" id="particleCount" min="0" max="1" value="0">
              <output>&hellip;</output>
            </label>
          </div>
        </div>
      </section>

      <section class="ProjectSection" data-route="projects"></section>

      <section class="WorkSection" data-route="work"></section>

      <footer class="SiteFooter">
        <p>Harrison Oates</p>
      </footer>
    </main>

    <div class="BackgroundAnimation">
      <svg id="circleOne" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="gradient1" x1="0" x2="1" y1="1" y2="0">
            <stop offset="0%" stop-color="var(--wash-one)" />
            <stop offset="50%" stop-color="var(--wash-two)" />
            <stop offset="100%" stop-color="var(--wash-three)" />
          </linearGradient>
        </defs>
        <path d="M 0 3 A 3 3 45 0 0 0 -42 A 3 3 0 0 0 0 3 Z" fill="url(#gradient1)" transform="translate(50 50)" />
      </svg>
      <svg id="circleTwo" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="gradient2" x1="0" x2="1" y1="1" y2="0">
            <stop offset="0%" stop-color="var(--wash-two)" />
            <stop offset="50%" stop-color="var(--wash-three)" />
            <stop offset="100%" stop-color="var(--wash-one)" />
          </linearGradient>
        </defs>
        <path d="M 0 -3 A 3 3 45 0 0 0 42 A 3 3 45 0 0 0 -3 Z" fill="url(#gradient2)" transform="translate(50 50)" />
      </svg>
      <svg id="circleThree" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="gradient3" x1="0" x2="1" y1="1" y2="0">
            <stop offset="0%" stop-color="var(--wash-three)" />
            <stop offset="50%" stop-color="var(--wash-one)" />
            <stop offset="100%" stop-color="var(--wash-two)" />
          </linearGradient>
        </defs>
        <path d="M -54 0 A 3 3 0 0 0 -9 0 A 3 3 0 0 0 -54 0 Z" fill="url(#gradient3)" transform="translate(50 50)" />
      </svg>
    </div>
  </body>
</html>
