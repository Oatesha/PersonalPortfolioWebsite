<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Harrison Oates, embedded software performance engineer.">
    <meta name="theme-color" content="#cbcac7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#181715" media="(prefers-color-scheme: dark)">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Harrison Oates">
    <meta property="og:description" content="Embedded software performance engineer">
    <meta property="og:url" content="https://personalportfoliowebsite-zi3.pages.dev/">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/svg+xml" href="/burger.svg" />
    <link rel="stylesheet" href="style.css">
    <title>Harrison Oates Personal Website</title>
    <script src="main.js" type="module"></script>
  </head>
  <body>

    <header class="NavRoot"></header>

    <div class="scroll-container">
      <section class="LoaderLogoSection" data-route="home">
        <!-- decorative -->
        <div class="LoadingText" aria-hidden="true">
          HO
        </div>
      </section>

      <section class="LandingPageSection" data-route="home">
        <div class="LandingStage" aria-hidden="true"></div>

        <div class="LandingLead">
          <h1 class="MyName">Harrison Oates</h1>
          <p class="LandingRole">Embedded software performance engineer at DroneShield.</p>
        </div>

        <div class="LandingBand">
          <div class="attractor-switch"></div>
          <div class="ViewerControls">
            <!-- autocomplete off because chrome restores the old value on reload -->
            <label class="viewer-control" for="particleSizeInput">
              <span class="viewer-control-name">Size</span>
              <input type="range" id="particleSizeInput" min="0" max="1" step="1" value="0" list="particleSizeTicks" autocomplete="off">
              <datalist id="particleSizeTicks"></datalist>
              <output for="particleSizeInput">1.0</output>
            </label>
            <label class="viewer-control" for="particleCountInput">
              <span class="viewer-control-name">Particles</span>
              <input type="range" id="particleCountInput" min="0" max="1" step="1" value="0" list="particleCountTicks" autocomplete="off">
              <datalist id="particleCountTicks"></datalist>
              <output for="particleCountInput">&hellip;</output>
            </label>
          </div>
        </div>
      </section>

      <section class="ProjectSection" data-route="projects"></section>

      <section class="WorkSection" data-route="work"></section>

      <footer class="SiteFooter">
        <p>Harrison Oates</p>
      </footer>


    </div>
    <div class="BackgroundAnimation">
      <div class="SvgContainer">
        <svg id="circleOne" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient1" x1="0" x2="1" y1="1" y2="0">
              <stop offset="0%" stop-color="var(--color-stop-1)" />
              <stop offset="50%" stop-color="var(--color-stop-2)" />
              <stop offset="100%" stop-color="var(--color-stop-3)" />
            </linearGradient>
          </defs>
          <path d="M 0 3 A 3 3 45 0 0 0 -42 A 3 3 0 0 0 0 3 Z" fill="url(#gradient1)" transform="translate(50 50)"></path>
        </svg>

        <svg id="circleTwo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient2" x1="0" x2="1" y1="1" y2="0">
              <stop offset="0%" stop-color="var(--color-stop-1)" />
              <stop offset="50%" stop-color="var(--color-stop-2)" />
              <stop offset="100%" stop-color="var(--color-stop-3)" />
            </linearGradient>
          </defs>
          <path d="M 0 -3 A 3 3 45 0 0 0 42 A 3 3 45 0 0 0 -3 Z" fill="url(#gradient2)" transform="translate(50 50)"></path>
        </svg>

        <svg id="circleThree" x="0" y="0" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gradient3" x1="0" x2="1" y1="1" y2="0">
              <stop offset="0%" stop-color="var(--color-stop-1)" />
              <stop offset="50%" stop-color="var(--color-stop-2)" />
              <stop offset="100%" stop-color="var(--color-stop-3)" />
            </linearGradient>
          </defs>
          <path d="M -54 0 A 3 3 0 0 0 -9 0 A 3 3 0 0 0 -54 0 Z" fill="url(#gradient3)" transform="translate(50 50)"></path>
        </svg>
      </div>
    </div>
  </body>
</html>
